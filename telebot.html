<body>
    <h1>hello word</h1>
<script>



// ==========================================================
//  ANIME TELEGRAM BOT
//  Oddiy va tushunarli qilib yozilgan (node-telegram-bot-api)
// ==========================================================
//
//  ISHLASH TARTIBI:
//  1. Foydalanuvchi /start bosadi
//  2. Bot salom beradi va "qanday anime ko'rmoqchisiz?" deb so'raydi
//  3. Pastda anime tugmalari + "Saytga kirish" tugmasi chiqadi
//  4. Anime tanlansa -> fasllar chiqadi (1-fasl, 2-fasl...)
//  5. Fasl tanlansa -> qismlar chiqadi (1,2,3...12)
//  6. Qism tanlansa -> avval 2 ta kanalga obuna bo'lganligi tekshiriladi
//  7. Obuna bo'lgan bo'lsa -> kontent kanalidan o'sha qism forward qilinadi
//
// ==========================================================

const TelegramBot = require('node-telegram-bot-api');

// ==========================================================
// 1) SOZLAMALAR — shu joyni o'zingizga moslab to'ldiring
// ==========================================================

// @BotFather dan olingan bot tokeningiz
const BOT_TOKEN = '8055090268:AAHtu9cy9lnZw_GFZqo8mc860Bj9G3H7vOU';

// Saytingiz manzili ("Saytga kirish" tugmasi shu yerga olib boradi)
const WEBSITE_URL = 'https://animecorestudeo.vercel.app/';

// Majburiy obuna bo'lish kerak bo'lgan kanallar (2 tasi)
// id -> @username yoki -100 bilan boshlanuvchi kanal ID
// url -> kanal havolasi (tugmada ko'rinadi)
const REQUIRED_CHANNELS = [
  { id: '@kanal_username_1', url: 'https://t.me/shohcore1', name: '1-kanal' },
  { id: '@kanal_username_2', url: 'https://t.me/Mobilografsamarqand', name: '2-kanal' },
  { id: '@kanal_username_3', url: 'https://t.me/animecorestudeo', name: '3-kanal' },
];

// Anime qismlari saqlanadigan kontent kanali
// DIQQAT: bot shu kanalda ADMIN bo'lishi SHART (forward qilish uchun)
const CONTENT_CHANNEL_ID = 'https://t.me/animecorestudeo'; // yoki -100xxxxxxxxxx

// ==========================================================
// 2) YORDAMCHI FUNKSIYA — qismlarni oson generatsiya qilish uchun
// ==========================================================
//
// Masalan: qismlarniYarat(101, 12) chaqirilsa,
// natija: { 1: 101, 2: 102, 3: 103, ... , 12: 112 }
//
// ya'ni: kontent kanalidagi 101-xabar = 1-qism, 102-xabar = 2-qism va h.k.
// Agar sizning kanalingizda xabarlar ketma-ket bo'lmasa,
// pastdagi "arifureta" misolidagi kabi qo'lda ham yozishingiz mumkin.

function qismlarniYarat(boshlangichXabarId, qismlarSoni) {
  const natija = {};
  for (let i = 1; i <= qismlarSoni; i++) {
    natija[i] = boshlangichXabarId + (i - 1);
  }
  return natija;
}

// ==========================================================
// 3) ANIMELAR RO'YXATI
// ==========================================================
//
// YANGI ANIME QO'SHISH UCHUN:
//   1) pastga yangi "kalit: {...}" qo'shing
//   2) title -> tugmada ko'rinadigan nom
//   3) seasons ichiga fasllarni yozing
//   4) episodes ichiga -> { qism_raqami: kanaldagi_xabar_id }
//
// YANGI FASL QO'SHISH UCHUN:
//   mavjud anime ichidagi "seasons" ga s3, s4... deb qo'shavering
//
// YANGI QISM QO'SHISH UCHUN:
//   qismlarniYarat() dagi sonni oshiring yoki episodes ga qo'lda qo'shing

const ANIME_LIST = {
  arra_odam: {
    title: '🪚 Arra odam',
    seasons: {
      s1: { title: '1-fasl', episodes: qismlarniYarat(101, 12) }, // 101-112 xabarlar
      s2: { title: '2-fasl', episodes: qismlarniYarat(201, 12) }, // 201-212 xabarlar
    },
  },
  sollo_leviling: {
    title: '⚔️ Sollo Leviling',
    seasons: {
      s1: { title: '1-fasl', episodes: qismlarniYarat(301, 12) },
      s2: { title: '2-fasl', episodes: qismlarniYarat(401, 12) },
    },
  },
  yugereni_abadiyligi: {
    title: '🌙 Yugereni abadiyligi',
    seasons: {
      s1: { title: '1-fasl', episodes: qismlarniYarat(501, 12) },
      s2: { title: '2-fasl', episodes: qismlarniYarat(601, 12) },
    },
  },
  zulmat_farzandi: {
    title: '🌑 Zulmat farzandi',
    seasons: {
      s1: { title: '1-fasl', episodes: qismlarniYarat(701, 12) },
      s2: { title: '2-fasl', episodes: qismlarniYarat(801, 12) },
    },
  },
  gachiakutura: {
    title: '🔥 Gachiakuta',
    seasons: {
      s1: { title: '1-fasl', episodes: qismlarniYarat(901, 12) },
      s2: { title: '2-fasl', episodes: qismlarniYarat(1001, 12) },
    },
  },
  arifureta: {
    title: '✨ Arifureta',
    seasons: {
      // Misol: agar xabarlar ketma-ket bo'lmasa, qo'lda ham yozsa bo'ladi
      s1: {
        title: '1-fasl',
        episodes: {
          1: 1101, 2: 1102, 3: 1103, 4: 1104, 5: 1105, 6: 1106,
          7: 1107, 8: 1108, 9: 1109, 10: 1110, 11: 1111, 12: 1112,
        },
      },
      s2: { title: '2-fasl', episodes: qismlarniYarat(1201, 12) },
    },
  },
};

// ==========================================================
// 4) BOTNI ISHGA TUSHIRISH
// ==========================================================

// Token to'ldirilmagan bo'lsa - ogohlantirib, botni ishga tushirmaymiz
if (!BOT_TOKEN || BOT_TOKEN === '8055090268:AAHtu9cy9lnZw_GFZqo8mc860Bj9G3H7vOU') {
  console.error('❌ XATOLIK: BOT_TOKEN to\'ldirilmagan!');
  console.error('   bot.js faylining yuqorisida BOT_TOKEN qatoriga @BotFather dan olgan tokeningizni yozing.');
  process.exit(1);
}

const bot = new TelegramBot(BOT_TOKEN, { polling: true });

console.log('🤖 Bot ishga tushdi...');
console.log('   Botni to\'xtatish uchun: Ctrl + C');

// ==========================================================
// 5) /start BUYRUG'I
// ==========================================================

bot.onText(/\/start/, (msg) => {
  const chatId = msg.chat.id;
  const ism = msg.from.first_name || 'do\'stim';

  const matn =
    `Salom, ${ism}! 👋\n\n` +
    `Anime botimizga xush kelibsiz 🎬\n\n` +
    `Qanday anime ko'rmoqchisiz? Pastdan tanlang 👇\n` +
    `Yoki saytimizga kirib ko'rishingiz ham mumkin 🌐`;

  bot.sendMessage(chatId, matn, {
    reply_markup: animeMenyusiniYasash(),
  });
});

// Anime tugmalari + saytga kirish tugmasi bo'lgan menyu
function animeMenyusiniYasash() {
  const tugmalar = [];

  // Har bir animedan bitta tugma, 2 tadan qatorga joylaymiz
  const animeKalitlar = Object.keys(ANIME_LIST);
  for (let i = 0; i < animeKalitlar.length; i += 2) {
    const qator = [];
    qator.push({
      text: ANIME_LIST[animeKalitlar[i]].title,
      callback_data: `anime:${animeKalitlar[i]}`,
    });
    if (animeKalitlar[i + 1]) {
      qator.push({
        text: ANIME_LIST[animeKalitlar[i + 1]].title,
        callback_data: `anime:${animeKalitlar[i + 1]}`,
      });
    }
    tugmalar.push(qator);
  }

  // Saytga kirish tugmasi (alohida qatorda, URL tugma)
  tugmalar.push([{ text: '🌐 Saytga kirish', url: WEBSITE_URL }]);

  return { inline_keyboard: tugmalar };
}

// ==========================================================
// 6) TUGMA BOSILGANDA ISHLAYDIGAN QISM (callback_query)
// ==========================================================

bot.on('callback_query', async (query) => {
  const chatId = query.message.chat.id;
  const messageId = query.message.message_id;
  const data = query.data; // masalan: "anime:arra_odam"
  const userId = query.from.id;

  // callback_data ni ":" bo'yicha bo'lib olamiz
  const [amal, ...param] = data.split(':');

  try {
    if (amal === 'anime') {
      // ----- Fasllarni ko'rsatish -----
      const [animeKey] = param;
      await fasllarniKorsatish(chatId, messageId, animeKey);
    } else if (amal === 'season') {
      // ----- Qismlarni ko'rsatish -----
      const [animeKey, seasonKey] = param;
      await qismlarniKorsatish(chatId, messageId, animeKey, seasonKey);
    } else if (amal === 'ep') {
      // ----- Qism tanlandi -> obunani tekshirib, video yuborish -----
      const [animeKey, seasonKey, epNum] = param;
      await qismniYuborishGaHarakatQil(chatId, userId, animeKey, seasonKey, epNum);
    } else if (amal === 'check') {
      // ----- "✅ Tekshirish" tugmasi bosildi -----
      const [animeKey, seasonKey, epNum] = param;
      await qismniYuborishGaHarakatQil(chatId, userId, animeKey, seasonKey, epNum, true);
    } else if (amal === 'back_main') {
      // ----- Bosh menyuga qaytish -----
      await bot.editMessageText(
        'Qanday anime ko\'rmoqchisiz? Pastdan tanlang 👇',
        { chat_id: chatId, message_id: messageId, reply_markup: animeMenyusiniYasash() }
      );
    } else if (amal === 'back_seasons') {
      // ----- Fasllar ro'yxatiga qaytish -----
      const [animeKey] = param;
      await fasllarniKorsatish(chatId, messageId, animeKey);
    }

    // Tugma bosilganda "yuklanmoqda" degan holatni olib tashlaydi
    bot.answerCallbackQuery(query.id);
  } catch (xato) {
    console.error('Xatolik:', xato);
    bot.answerCallbackQuery(query.id, { text: 'Xatolik yuz berdi, qayta urinib ko\'ring.' });
  }
});

// ----------------------------------------------------------
// Fasllarni ko'rsatuvchi funksiya
// ----------------------------------------------------------
async function fasllarniKorsatish(chatId, messageId, animeKey) {
  const anime = ANIME_LIST[animeKey];
  if (!anime) return;

  const tugmalar = [];
  Object.keys(anime.seasons).forEach((seasonKey) => {
    tugmalar.push([
      {
        text: anime.seasons[seasonKey].title,
        callback_data: `season:${animeKey}:${seasonKey}`,
      },
    ]);
  });

  tugmalar.push([{ text: '🔙 Orqaga', callback_data: 'back_main' }]);

  await bot.editMessageText(`${anime.title}\n\nFaslni tanlang 👇`, {
    chat_id: chatId,
    message_id: messageId,
    reply_markup: { inline_keyboard: tugmalar },
  });
}

// ----------------------------------------------------------
// Qismlarni ko'rsatuvchi funksiya (1 dan 12 gacha tugmalar)
// ----------------------------------------------------------
async function qismlarniKorsatish(chatId, messageId, animeKey, seasonKey) {
  const anime = ANIME_LIST[animeKey];
  const season = anime.seasons[seasonKey];
  if (!season) return;

  const tugmalar = [];
  const qismRaqamlari = Object.keys(season.episodes);

  // Tugmalarni 4 tadan qatorga joylaymiz
  for (let i = 0; i < qismRaqamlari.length; i += 4) {
    const qator = qismRaqamlari.slice(i, i + 4).map((epNum) => ({
      text: `${epNum}-qism`,
      callback_data: `ep:${animeKey}:${seasonKey}:${epNum}`,
    }));
    tugmalar.push(qator);
  }

  tugmalar.push([{ text: '🔙 Orqaga', callback_data: `back_seasons:${animeKey}` }]);

  await bot.editMessageText(
    `${anime.title} — ${season.title}\n\nQismni tanlang 👇`,
    {
      chat_id: chatId,
      message_id: messageId,
      reply_markup: { inline_keyboard: tugmalar },
    }
  );
}

// ==========================================================
// 7) MAJBURIY OBUNANI TEKSHIRISH
// ==========================================================

// Foydalanuvchi barcha kanallarga obuna bo'lganmi - shuni tekshiradi
// Natija: obuna bo'lmagan kanallar ro'yxatini qaytaradi (bo'sh bo'lsa - hammasiga obuna)
async function obunaBolmaganKanallarniTop(userId) {
  const obunaBolmagan = [];

  for (const kanal of REQUIRED_CHANNELS) {
    try {
      const azo = await bot.getChatMember(kanal.id, userId);
      // "left" yoki "kicked" bo'lsa - demak obuna bo'lmagan
      if (azo.status === 'left' || azo.status === 'kicked') {
        obunaBolmagan.push(kanal);
      }
    } catch (xato) {
      // Bot kanalda admin bo'lmasa yoki xatolik bo'lsa ham,
      // xavfsizlik uchun obuna bo'lmagan deb hisoblaymiz
      console.error(`Kanalni tekshirishda xato (${kanal.id}):`, xato.message);
      obunaBolmagan.push(kanal);
    }
  }

  return obunaBolmagan;
}

// Obuna bo'lish kerakligini ko'rsatuvchi xabar
function obunaXabariniYubor(chatId, animeKey, seasonKey, epNum, obunaBolmagan) {
  const tugmalar = obunaBolmagan.map((kanal) => [
    { text: `➕ ${kanal.name}ga obuna bo'lish`, url: kanal.url },
  ]);

  tugmalar.push([
    { text: '✅ Tekshirish', callback_data: `check:${animeKey}:${seasonKey}:${epNum}` },
  ]);

  return bot.sendMessage(
    chatId,
    '⚠️ Qismni ko\'rish uchun quyidagi kanallarga obuna bo\'ling, so\'ngra "✅ Tekshirish" tugmasini bosing.',
    { reply_markup: { inline_keyboard: tugmalar } }
  );
}

// ----------------------------------------------------------
// Asosiy: obunani tekshirib, bo'lsa qismni forward qiladi
// ----------------------------------------------------------
async function qismniYuborishGaHarakatQil(chatId, userId, animeKey, seasonKey, epNum, qaytaTekshirish = false) {
  const obunaBolmagan = await obunaBolmaganKanallarniTop(userId);

  if (obunaBolmagan.length > 0) {
    if (qaytaTekshirish) {
      // "Tekshirish" tugmasi bosilgan, lekin hali ham obuna bo'lmagan
      await bot.sendMessage(chatId, '❌ Siz hali barcha kanallarga obuna bo\'lmagansiz.');
    }
    await obunaXabariniYubor(chatId, animeKey, seasonKey, epNum, obunaBolmagan);
    return;
  }

  // Hammasiga obuna bo'lgan - qismni yuboramiz
  const anime = ANIME_LIST[animeKey];
  const season = anime.seasons[seasonKey];
  const xabarId = season.episodes[epNum];

  if (!xabarId) {
    await bot.sendMessage(chatId, 'Kechirasiz, bu qism topilmadi.');
    return;
  }

  try {
    await bot.forwardMessage(chatId, CONTENT_CHANNEL_ID, xabarId);
    if (qaytaTekshirish) {
      await bot.sendMessage(chatId, '✅ Obuna tasdiqlandi! Qismingiz yuqorida 👆');
    }
  } catch (xato) {
    console.error('Forward qilishda xato:', xato.message);
    await bot.sendMessage(chatId, '❌ Qismni yuborishda xatolik yuz berdi. Keyinroq urinib ko\'ring.');
  }
}

// ==========================================================
// 8) UMUMIY XATOLIKLARNI USHLAB QOLISH
// ==========================================================

bot.on('polling_error', (xato) => {
  console.error('Polling xatosi:', xato.message);
});

</script>
